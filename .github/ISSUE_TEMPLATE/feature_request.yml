name: Feature request
description: Suggest a change or a new capability for the kyeot server
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Agents are brought by the user, so a proposal should not require agents to send anything beyond `message`, `task.end` and `approval` (see CONTRIBUTING.md).
        한국어로 적어도 됩니다.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
          required: false
